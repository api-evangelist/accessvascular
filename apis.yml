aid: accessvascular
name: Access Vascular, Inc.
description: >-
  Access Vascular, Inc. is a Billerica, Massachusetts medical device manufacturer that designs and
  builds vascular access catheters from a proprietary hydrophilic biomaterial engineered to retain
  water and mimic the chemistry of the body, with the goal of reducing thrombosis, infection and
  phlebitis in intravenous therapy. Its FDA-cleared products include HydroPICC, a peripherally
  inserted central catheter cleared in 2018 and later extended to a dual-lumen configuration, and
  HydroMID, a midline catheter cleared in 2021, both carrying an anti-thrombogenic indication. The
  company is a device manufacturer rather than a software or platform business, and publishes no
  developer program, public API, or machine-readable API contract on any host it operates.
